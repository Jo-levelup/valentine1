<title>it's your favorite🥀</title>

<style>
body{
margin:0;
height:100vh;
background:linear-gradient(#ff4d6d,#ff99ac);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial;
}

h1{
color:white;
text-shadow:2px 2px 5px black;
margin-bottom:20px;
}
p{
  color: honeydew;
  text-shadow: 2px 2px 5px black;
  text-trasnform: capitalize;
  
}

/* BORDER HEARTS */
.border{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
pointer-events:none;
border:25px solid transparent;
border-image: url("https://i.imgur.com/8XK0FQY.png") 30 round;
}

/* COKE BOTTLE */
#coke{
width:200px;
cursor:pointer;
transition:.2s;
}

/* SHAKE */
@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-10px)}
50%{transform:translateX(10px)}
75%{transform:translateX(-10px)}
100%{transform:translateX(0)}
}

.shake{
animation:shake .4s;
}

/* HEART FLOOD */
.heart{
position:absolute;
font-size:25px;
animation:fall linear forwards;
}

@keyframes fall{
from{transform:translateY(-50px)}
to{transform:translateY(110vh)}
}
</style>
</head>

<script>

// HEART FLOOD
function spawnHearts(){
for(let i=0;i<200;i++){
setTimeout(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=2+Math.random()*4+"s";
heart.style.fontSize=20+Math.random()*30+"px";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);
},i*20);
}
}

spawnHearts();

// COKE SHAKE
const coke=document.getElementById("coke");
coke.onclick=()=>{
coke.classList.add("shake");
setTimeout(()=>coke.classList.remove("shake"),400);
spawnHearts();
};

</script>
